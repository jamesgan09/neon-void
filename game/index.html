<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON VOID — a wave survival shooter</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    touch-action: none;
    cursor: crosshair;
    background: #05060f;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="NEON VOID: fly the ship with WASD, aim with the mouse, click to fire, survive the waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
